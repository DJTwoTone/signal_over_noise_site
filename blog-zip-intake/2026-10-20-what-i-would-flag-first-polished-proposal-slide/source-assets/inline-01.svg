<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A proposal claim matched to the evidence</title>
  <desc id="desc">Two illustrative proposal slides compare a company-wide process claim with a limited trial recommendation. Both use the same handoff observations. This is not client work.</desc>
  <rect width="1600" height="900" fill="#f5f0e8"/>
  <text x="64" y="67" fill="#8a641f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">PROPOSAL SLIDE REVIEW</text>
  <text x="64" y="132" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700" letter-spacing="-0.8">The claim outruns the evidence.</text>
  <line x1="64" y1="162" x2="1536" y2="162" stroke="#b99743" stroke-width="2"/>

  <rect x="64" y="194" width="720" height="624" rx="10" fill="#fffdf8" stroke="#d9d2c7" stroke-width="2"/>
  <rect x="816" y="194" width="720" height="624" rx="10" fill="#f8fbfc" stroke="#c9d7df" stroke-width="2"/>

  <rect x="96" y="223" width="118" height="34" rx="17" fill="#8a641f"/>
  <text x="155" y="246" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">BEFORE</text>
  <text x="96" y="312" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="-0.3">
    <tspan x="96" dy="0">A new handoff process</tspan>
    <tspan x="96" dy="39">will eliminate review delays</tspan>
  </text>
  <line x1="96" y1="376" x2="752" y2="376" stroke="#e0dbd2" stroke-width="2"/>
  <text x="96" y="414" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">OBSERVED</text>
  <circle cx="103" cy="450" r="5" fill="#b99743"/>
  <text x="122" y="457" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <tspan x="122" dy="0">Scope and ownership sit in separate</tspan>
    <tspan x="122" dy="28">handoff documents.</tspan>
  </text>
  <circle cx="103" cy="525" r="5" fill="#b99743"/>
  <text x="122" y="532" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <tspan x="122" dy="0">The final reviewer is confirmed after</tspan>
    <tspan x="122" dy="28">the work is ready for review.</tspan>
  </text>
  <line x1="96" y1="588" x2="752" y2="588" stroke="#e0dbd2" stroke-width="2"/>
  <text x="96" y="623" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DECISION NEEDED</text>
  <rect x="96" y="642" width="656" height="128" rx="7" fill="#f4eee4"/>
  <text x="119" y="688" fill="#132033" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    <tspan x="119" dy="0">Approve a new company-wide</tspan>
    <tspan x="119" dy="32">process.</tspan>
  </text>

  <rect x="848" y="223" width="118" height="34" rx="17" fill="#38556b"/>
  <text x="907" y="246" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2">AFTER</text>
  <text x="848" y="312" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700" letter-spacing="-0.3">
    <tspan x="848" dy="0">Name the final reviewer</tspan>
    <tspan x="848" dy="39">at kickoff.</tspan>
  </text>
  <line x1="848" y1="376" x2="1504" y2="376" stroke="#d6e0e5" stroke-width="2"/>
  <text x="848" y="414" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">SAME OBSERVATIONS</text>
  <circle cx="855" cy="450" r="5" fill="#b99743"/>
  <text x="874" y="457" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <tspan x="874" dy="0">Scope and ownership sit in separate</tspan>
    <tspan x="874" dy="28">handoff documents.</tspan>
  </text>
  <circle cx="855" cy="525" r="5" fill="#b99743"/>
  <text x="874" y="532" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <tspan x="874" dy="0">The final reviewer is confirmed after</tspan>
    <tspan x="874" dy="28">the work is ready for review.</tspan>
  </text>
  <line x1="848" y1="588" x2="1504" y2="588" stroke="#d6e0e5" stroke-width="2"/>
  <text x="848" y="623" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">DECISION NEEDED</text>
  <rect x="848" y="642" width="656" height="128" rx="7" fill="#e8f0f4"/>
  <text x="871" y="688" fill="#132033" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    <tspan x="871" dy="0">Approve a limited trial on one</tspan>
    <tspan x="871" dy="32">upcoming project.</tspan>
  </text>

  <line x1="64" y1="850" x2="1536" y2="850" stroke="#c9d7df" stroke-width="2"/>
  <text x="64" y="882" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">ILLUSTRATIVE EXAMPLE — NOT CLIENT WORK</text>
</svg>
