  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <text x="72" y="104" fill="#8a641f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">TECHNICAL EVIDENCE</text>
  <text x="72" y="190" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" letter-spacing="-1">A Technical Result</text>
