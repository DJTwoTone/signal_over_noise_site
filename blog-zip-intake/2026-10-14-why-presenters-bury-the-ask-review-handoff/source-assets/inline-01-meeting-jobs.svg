<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" rx="28" fill="#f5f0e8" />
  <text x="68" y="76" fill="#8a641f" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">THE ROOM'S ROLE</text>
  <text x="68" y="138" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="43" font-weight="700">Give the room one clear job</text>
  <text x="68" y="184" fill="#41607d" font-family="Arial, sans-serif" font-size="22">Choose what you need before you add the background.</text>

  <rect x="62" y="232" width="340" height="438" rx="22" fill="#0b2d53" />
  <circle cx="116" cy="294" r="30" fill="#f2e5c8" />
  <path d="M102 294l10 10 19-22" fill="none" stroke="#0b2d53" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <text x="98" y="370" fill="#fbf7f0" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">DECISION</text>
  <text x="98" y="427" fill="#fbf7f0" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Choose or</text>
  <text x="98" y="467" fill="#fbf7f0" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">approve a step.</text>
  <text x="98" y="528" fill="#d7e1ec" font-family="Arial, sans-serif" font-size="20">Name the action</text>
  <text x="98" y="558" fill="#d7e1ec" font-family="Arial, sans-serif" font-size="20">you need today.</text>

  <rect x="430" y="232" width="340" height="438" rx="22" fill="#faf7f2" stroke="#e7dcc7" stroke-width="2" />
  <circle cx="484" cy="294" r="30" fill="#edf3f9" />
  <path d="M469 281h29a5 5 0 0 1 5 5v15a5 5 0 0 1-5 5h-13l-9 7v-7h-7a5 5 0 0 1-5-5v-15a5 5 0 0 1 5-5z" fill="none" stroke="#193b64" stroke-width="4" stroke-linejoin="round" />
  <text x="462" y="370" fill="#193b64" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">ADVICE</text>
  <text x="462" y="427" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Answer one</text>
  <text x="462" y="467" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">open question.</text>
  <text x="462" y="528" fill="#41607d" font-family="Arial, sans-serif" font-size="20">Say what is still</text>
  <text x="462" y="558" fill="#41607d" font-family="Arial, sans-serif" font-size="20">undecided.</text>

  <rect x="798" y="232" width="340" height="438" rx="22" fill="#edf3f9" />
  <circle cx="852" cy="294" r="30" fill="#f2e5c8" />
  <circle cx="852" cy="294" r="18" fill="none" stroke="#193b64" stroke-width="4" />
  <line x1="852" y1="290" x2="852" y2="302" stroke="#193b64" stroke-width="4" stroke-linecap="round" />
  <circle cx="852" cy="283" r="2.6" fill="#193b64" />
  <text x="830" y="370" fill="#193b64" font-family="Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="2">UPDATE</text>
  <text x="830" y="427" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Share what</text>
  <text x="830" y="467" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">has changed.</text>
  <text x="830" y="528" fill="#41607d" font-family="Arial, sans-serif" font-size="20">Say when no decision</text>
  <text x="830" y="558" fill="#41607d" font-family="Arial, sans-serif" font-size="20">is needed.</text>

  <text x="600" y="735" text-anchor="middle" fill="#5c6f82" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">ILLUSTRATIVE FRAMEWORK · NO CLIENT MATERIAL</text>
</svg>
