<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Label Early Customer Proof Before It Goes on the Slide</title>
  <desc id="desc">Social cover with the article title and a reviewer sorting customer-evidence cards.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f0e8" stop-opacity=".96"/>
      <stop offset=".47" stop-color="#f5f0e8" stop-opacity=".84"/>
      <stop offset=".72" stop-color="#f5f0e8" stop-opacity=".24"/>
      <stop offset=".9" stop-color="#f5f0e8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#wash)"/>
  <text x="76" y="91" fill="#8a641f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3.3">CUSTOMER EVIDENCE</text>
  <text x="76" y="176" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="-1.1">Label Early Customer</text>
  <text x="76" y="231" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="-1.1">Proof Before It Goes</text>
  <text x="76" y="286" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="-1.1">on the Slide</text>
  <line x1="76" y1="329" x2="156" y2="329" stroke="#b99743" stroke-width="3"/>
  <text x="76" y="371" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500">Show what has happened and what comes next.</text>
  <text x="76" y="548" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700">SoN Insights</text>
  <line x1="76" y1="572" x2="142" y2="572" stroke="#b99743" stroke-width="2"/>
</svg>
