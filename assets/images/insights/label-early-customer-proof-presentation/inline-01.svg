<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Early customer evidence, labeled by stage and status</title>
  <desc id="desc">A synthetic slide separates a reported problem conversation, an agreed evaluation, and a second customer's agreed but unstarted pilot. It says no pilot results are available and identifies a next step. Not client work.</desc>
  <rect width="1600" height="900" fill="#f5f0e8"/>
  <text x="64" y="64" fill="#8a641f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3.2">CUSTOMER EVIDENCE</text>
  <text x="64" y="129" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="-.8">Early customer evidence</text>
  <line x1="64" y1="158" x2="1536" y2="158" stroke="#b99743" stroke-width="2"/>

  <rect x="64" y="190" width="464" height="410" rx="10" fill="#fffdf8" stroke="#d9d2c7" stroke-width="2"/>
  <rect x="568" y="190" width="464" height="410" rx="10" fill="#f8fbfc" stroke="#c9d7df" stroke-width="2"/>
  <rect x="1072" y="190" width="464" height="410" rx="10" fill="#fffdf8" stroke="#d9d2c7" stroke-width="2"/>

  <rect x="96" y="222" width="206" height="34" rx="17" fill="#8a641f"/>
  <text x="199" y="245" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">CONVERSATION</text>
  <text x="96" y="306" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Problem raised</text>
  <line x1="96" y1="332" x2="496" y2="332" stroke="#e0dbd2" stroke-width="2"/>
  <text x="96" y="378" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <tspan x="96" dy="0">An operations leader described</tspan>
    <tspan x="96" dy="29">difficulty tracking incoming</tspan>
    <tspan x="96" dy="29">requests across systems.</tspan>
  </text>
  <text x="96" y="550" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">STATUS · REPORTED IN CONVERSATION</text>

  <rect x="600" y="222" width="166" height="34" rx="17" fill="#38556b"/>
  <text x="683" y="245" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">EVALUATION</text>
  <text x="600" y="306" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Fit being checked</text>
  <line x1="600" y1="332" x2="1000" y2="332" stroke="#d6e0e5" stroke-width="2"/>
  <text x="600" y="378" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <tspan x="600" dy="0">One prospective customer agreed</tspan>
    <tspan x="600" dy="29">to assess the tool against its</tspan>
    <tspan x="600" dy="29">current intake workflow.</tspan>
  </text>
  <text x="600" y="550" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">STATUS · EVALUATION AGREED</text>

  <rect x="1104" y="222" width="112" height="34" rx="17" fill="#8a641f"/>
  <text x="1160" y="245" text-anchor="middle" fill="#fffdf8" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">PILOT</text>
  <text x="1104" y="306" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">Agreed, not started</text>
  <line x1="1104" y1="332" x2="1504" y2="332" stroke="#e0dbd2" stroke-width="2"/>
  <text x="1104" y="378" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <tspan x="1104" dy="0">A second customer agreed to a</tspan>
    <tspan x="1104" dy="29">limited pilot for one workflow.</tspan>
    <tspan x="1104" dy="29">The start date is pending.</tspan>
  </text>
  <text x="1104" y="550" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">STATUS · NOT UNDERWAY</text>

  <rect x="64" y="630" width="432" height="138" rx="8" fill="#f4eee4"/>
  <text x="92" y="668" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">OUTCOME</text>
  <text x="92" y="714" fill="#132033" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">No pilot results yet.</text>

  <rect x="520" y="630" width="1016" height="138" rx="8" fill="#e8f0f4"/>
  <text x="548" y="668" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">NEXT STEP</text>
  <text x="548" y="714" fill="#132033" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Confirm the pilot start date and agree what the team will review.</text>

  <line x1="64" y1="830" x2="1536" y2="830" stroke="#c9d7df" stroke-width="2"/>
  <text x="64" y="870" fill="#536276" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">ILLUSTRATIVE EXAMPLE — NOT CLIENT WORK</text>
</svg>
