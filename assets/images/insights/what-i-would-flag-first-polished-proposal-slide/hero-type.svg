<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What I Would Flag First on a Polished Proposal Slide</title>
  <desc id="desc">A clear editorial title overlay for a human reviewer examining a proposal slide.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f0e8" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#f5f0e8" stop-opacity=".63"/>
      <stop offset=".78" stop-color="#f5f0e8" stop-opacity=".06"/>
      <stop offset="1" stop-color="#f5f0e8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <text x="120" y="225" fill="#8a641f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" letter-spacing="4">SLIDE REVIEW</text>
  <text x="120" y="326" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-1.5">What I Would Flag</text>
  <text x="120" y="401" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-1.5">First on a Polished</text>
  <text x="120" y="476" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-1.5">Proposal Slide</text>
  <line x1="120" y1="535" x2="214" y2="535" stroke="#b99743" stroke-width="4"/>
  <text x="120" y="598" fill="#253349" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="500">Does the evidence earn this level of commitment?</text>
  <text x="120" y="815" fill="#132033" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700">SoN Insights</text>
  <line x1="120" y1="838" x2="198" y2="838" stroke="#b99743" stroke-width="2"/>
</svg>

